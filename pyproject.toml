[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brandguard"
version = "0.1.0"
description = "BrandGuard AI: a governed marketing AI product. Audience discovery and brand-safe copy generation, governed by design."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Kamil Mufti" }]
maintainers = [{ name = "Kamil Mufti" }]
keywords = [
  "marketing-ai",
  "governed-ai",
  "rag",
  "brand-safety",
  "hallucination-eval",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies. intelliflow-core is installed as an editable local
# install via `pip install -e ../intelliflow-core` (see README and CLAUDE.md).
# It is intentionally NOT pinned here because it is a sibling source-tree dep,
# not a published package.
dependencies = [
  "faiss-cpu>=1.8.0",
  "langgraph>=0.2.0",
  "ragas>=0.2.0",
  "Faker>=24.0",
  "anthropic>=0.40.0",
  "fastembed>=0.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/kmufti7/brandguard-ai"
Repository = "https://github.com/kmufti7/brandguard-ai"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
